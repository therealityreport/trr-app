packages:
  - "apps/*"
  - "!apps/vue-wordle"

nodeVersion: 24.14.0

allowBuilds:
  # Firebase SDK utility package used by firebase/firebase-admin; trusted first-party dependency.
  '@firebase/util': true
  # Sentry's official CLI package used for release/source-map tooling.
  '@sentry/cli': true
  # esbuild downloads its platform binary during install; required by common web tooling.
  esbuild: true
  # protobufjs generates fast protocol-buffer helpers during install.
  protobufjs: true
  # re2 builds the native safe-regex engine used by dependent packages.
  re2: true
  # sharp installs native image-processing binaries used by Next/image workflows.
  sharp: true
  # unrs-resolver installs native resolver bindings used by modern JS tooling.
  unrs-resolver: true

overrides:
  glob: 10.4.5
  json-ptr: 3.1.0
  jwks-rsa@4>jose: 5.10.0
  node-domexception: 2.0.2

minimumReleaseAgeExclude:
  - '@supabase/auth-js@2.110.0'
  - '@supabase/functions-js@2.110.0'
  - '@supabase/postgrest-js@2.110.0'
  - '@supabase/realtime-js@2.110.0'
  - '@supabase/storage-js@2.110.0'
  - '@supabase/supabase-js@2.110.0'
  - '@tailwindcss/node@4.3.2'
  - '@tailwindcss/oxide-android-arm64@4.3.2'
  - '@tailwindcss/oxide-darwin-arm64@4.3.2'
  - '@tailwindcss/oxide-darwin-x64@4.3.2'
  - '@tailwindcss/oxide-freebsd-x64@4.3.2'
  - '@tailwindcss/oxide-linux-arm-gnueabihf@4.3.2'
  - '@tailwindcss/oxide-linux-arm64-gnu@4.3.2'
  - '@tailwindcss/oxide-linux-arm64-musl@4.3.2'
  - '@tailwindcss/oxide-linux-x64-gnu@4.3.2'
  - '@tailwindcss/oxide-linux-x64-musl@4.3.2'
  - '@tailwindcss/oxide-wasm32-wasi@4.3.2'
  - '@tailwindcss/oxide-win32-arm64-msvc@4.3.2'
  - '@tailwindcss/oxide-win32-x64-msvc@4.3.2'
  - '@tailwindcss/oxide@4.3.2'
  - '@tailwindcss/postcss@4.3.2'
  - framer-motion@12.42.1
  - motion-dom@12.42.1
  - tailwindcss@4.3.2
