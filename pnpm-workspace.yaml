packages:
  - "apps/*"
  - "!apps/vue-wordle"
  - "tools/trr-api-types"

nodeVersion: 24.21.0

allowBuilds:
  # Firebase SDK utility package used by firebase/firebase-admin; trusted first-party dependency.
  '@firebase/util': true
  # Sentry's official CLI package used for release/source-map tooling.
  '@sentry/cli': true
  # esbuild downloads its platform binary during install; required by common web tooling.
  esbuild: true
  # protobufjs generates fast protocol-buffer helpers during install.
  protobufjs: true
  # re2 builds the native safe-regex engine used by dependent packages.
  re2: true
  # sharp installs native image-processing binaries used by Next/image workflows.
  sharp: true
  # unrs-resolver installs native resolver bindings used by modern JS tooling.
  unrs-resolver: true

overrides:
  'glob@>=10.2.0 <10.5.0': 10.5.0
  # Patch vulnerable branches without changing dependency majors.
  '@fastify/busboy@>=3.0.0 <3.2.1': 3.2.1
  '@grpc/grpc-js@>=1.12.6 <1.14.5': 1.14.5
  '@hono/node-server@>=1.0.0 <1.19.15': 1.19.15
  '@redocly/openapi-core@>=1.34.17 <1.34.20': 1.34.20
  'body-parser@>=1.0.0 <1.20.8': 1.20.8
  'brace-expansion@>=1.0.0 <1.1.21': 1.1.21
  'brace-expansion@>=2.0.0 <2.1.7': 2.1.7
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'browserslist@>=4.0.0 <4.28.7': 4.28.7
  'concurrently@>=10.0.0 <10.0.4': 10.0.4
  'firebase-tools@15.32.1>express': 4.22.3
  'fast-uri@>=3.0.0 <3.1.8': 3.1.8
  'fast-xml-parser@>=5.0.0 <5.10.1': 5.10.1
  'hono@>=4.0.0 <4.13.7': 4.13.7
  'ip-address@>=10.0.0 <10.7.1': 10.7.1
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'morgan@>=1.0.0 <1.12.1': 1.12.1
  'nanoid@>=3.0.0 <3.3.18': 3.3.18
  'postcss@>=8.0.0 <8.5.23': 8.5.23
