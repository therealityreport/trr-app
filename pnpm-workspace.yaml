  'qs@>=6.0.0 <6.16.0': 6.16.0
  're2@>=1.0.0 <1.26.1': 1.26.1
  'shell-quote@>=1.0.0 <1.9.0': 1.9.0
  'tar@>=7.0.0 <7.5.21': 7.5.21
  'undici@>=6.0.0 <6.28.1': 6.28.1
  'undici@>=7.0.0 <7.29.1': 7.29.1
  json-ptr: 3.1.0
  jwks-rsa@4>jose: 5.10.0
  node-domexception: 2.0.2

