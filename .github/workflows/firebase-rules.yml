name: Firestore Rules CI

on:
  push:
    branches: [ main ]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/firebase-rules.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/firebase-rules.yml'

jobs:
  validate:
    name: Validate rules on PRs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Firebase CLI
        run: npm i -g firebase-tools@15.11.0
      - name: Ensure Java (for emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Compile rules via emulator
        env:
          FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
          FIRESTORE_EMULATOR_HOST: localhost:8080
        run: |
          # Start only Firestore emulator to validate rules load; exits after command
          # Pin a demo project; pass the child command as one CLI argument.
          firebase emulators:exec --project demo-trr-plan055 --only firestore "echo Rules loaded"
        shell: bash

  deploy:
    name: Deploy rules on main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Firebase CLI
        run: npm i -g firebase-tools@15.11.0
      - name: Deploy Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_RULES_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-rules-credentials.json
        run: |
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          node <<'NODE'
          const fs = require('node:fs');
          const account = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT || '{}');
          if (account.type !== 'service_account' || account.project_id !== 'trr-web-25d2e') {
            throw new Error('Firebase rules credentials must belong to trr-web-25d2e');
          }
          fs.writeFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, JSON.stringify(account), {mode: 0o600});
          NODE
          unset FIREBASE_SERVICE_ACCOUNT
          firebase deploy --only firestore:rules --project trr-web-25d2e --non-interactive
