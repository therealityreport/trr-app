name: Web Tests

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/web/**'
      - 'tools/trr-api-types/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - 'scripts/node-baseline-smoke*'
      - '.github/workflows/web-tests.yml'

jobs:
  web-ci:
    name: Web CI (Node ${{ matrix.node-version }} / ${{ matrix.lane }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 24
            lane: full
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - name: Check for unresolved merge markers
        run: |
          if git grep -n -E '^(<<<<<<< |>>>>>>> )' -- .; then
            echo "Unresolved merge markers detected. Resolve conflicts before merge." >&2
            exit 1
          fi
      - name: Enforce pnpm lockfile
        run: |
          if [ -f apps/web/package-lock.json ]; then
            echo "apps/web/package-lock.json detected. Use pnpm and remove npm lockfiles." >&2
            exit 1
          fi
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Bootstrap the pinned package manager
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack prepare pnpm@11.5.2 --activate
          test "$(corepack --version)" = "0.36.0"
          test "$(pnpm --version)" = "11.5.2"
        working-directory: .
      # Cache setup runs only after pnpm exists on the selected Node runtime.
      - name: Cache pnpm dependencies
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Validate env contract
        run: |
          python3 scripts/check_env_example.py \
            --file apps/web/.env.example \
            --required TRR_API_URL TRR_INTERNAL_ADMIN_SHARED_SECRET
        working-directory: .
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Verify the supported Node baseline
        run: pnpm smoke:node-baseline
        working-directory: .
      - name: Test the runtime smoke modes
        run: node --test scripts/node-baseline-smoke.test.mjs
        working-directory: .
      - name: Run lint
        run: pnpm run lint
      - name: Run targeted fandom typecheck (Node 24 full lane)
        if: matrix.lane == 'full'
        run: pnpm run typecheck:fandom
      - name: Run full typecheck
        if: matrix.lane == 'full'
        run: pnpm run typecheck
      - name: Install Playwright Chromium
        if: matrix.lane == 'full'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run unit tests (Node 24 full lane)
        if: matrix.lane == 'full'
        run: pnpm run test:ci
      - name: Run Playwright e2e smoke
        if: matrix.lane == 'full'
        run: pnpm run test:e2e
        env:
          DATABASE_URL: ""
          TRR_API_URL: "http://127.0.0.1:8000"
          NEXT_PUBLIC_FIREBASE_API_KEY: "placeholder-api-key-for-build"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "placeholder.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "demo-build"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "demo-build.firebasestorage.app"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:1234567890:web:demo-build"
      - name: Build (no DATABASE_URL)
        run: pnpm run build
        env:
          # Unset DATABASE_URL to test build without DB
          DATABASE_URL: ""
          # Provide placeholder Firebase config for build (pages prerender during build)
          NEXT_PUBLIC_FIREBASE_API_KEY: "placeholder-api-key-for-build"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "placeholder.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "demo-build"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "demo-build.firebasestorage.app"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:1234567890:web:demo-build"
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always() && matrix.lane == 'full'
        with:
          name: web-coverage-node-${{ matrix.node-version }}
          path: apps/web/coverage
          if-no-files-found: ignore

  node-26-preview:
    name: Node 26 Preview (observational)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Preview the current runtime without changing the Node 24 engine policy.
      npm_config_engine_strict: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Bootstrap the pinned package manager
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack prepare pnpm@11.5.2 --activate
          test "$(corepack --version)" = "0.36.0"
          test "$(pnpm --version)" = "11.5.2"
      - name: Install the frozen workspace dependencies
        run: pnpm install --frozen-lockfile --config.engine-strict=false
      - name: Prove the Node 26 preview without switching runtimes
        run: pnpm smoke:node-baseline --mode=node26-preview
      - name: Test the smoke modes and standalone checkout
        run: node --test scripts/node-baseline-smoke.test.mjs
      - name: Typecheck the application
        run: pnpm -C apps/web run typecheck
      - name: Exercise representative application contracts
        run: pnpm -C apps/web exec vitest run -c vitest.config.mts tests/public-identity-contract.test.ts tests/proxy-routing.test.ts
      - name: Probe the web build without production credentials
        run: pnpm web:build
        env:
          DATABASE_URL: ""
          NEXT_PUBLIC_FIREBASE_API_KEY: "placeholder-api-key-for-build"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "placeholder.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "demo-build"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "demo-build.firebasestorage.app"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:1234567890:web:demo-build"
